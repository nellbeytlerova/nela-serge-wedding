<style>
:root{
  --bg1:#fffdfb;
  --bg2:#f9f0ea;
  --bg3:#f0ddd6;
  --text:#6f5560;
  --muted:#9a7f87;
  --gold:#c7a06a;
  --gold2:#e8cfaa;
  --rose:#b98b95;
  --rose2:#8b6470;
  --white:#ffffff;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;
  font-family:Montserrat,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at top, rgba(255,255,255,.95) 0%, rgba(255,255,255,.65) 18%, rgba(255,255,255,0) 40%),

}
.grain{
  position:fixed; inset:0; pointer-events:none; opacity:.04;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E");
}
main.frame{

}
.frame:before{
  content:"";

  inset:14px;
  border:1px solid rgba(199,160,106,.65);
  border-radius:120px 120px 16px 16px;
  pointer-events:none;
}
.frame:after{
  content:"";

.eyebrow{margin-top:24px;letter-spacing:.34em;text-transform:uppercase;font-size:11px;color:var(--muted);font-weight:600}

.subtitle{

@keyframes fall{

  8%{opacity:1}

<body>
<div class="grain"></div>
<div class="confetti-layer" id="confetti-layer" aria-hidden="true"></div>
<main class="frame">
  <span class="corner tl">✧</span><span class="corner tr">✧</span><span class="corner bl">✧</span><span class="corner br">✧</span>
  <div class="eyebrow">Together with their families</div>
  <div class="invitation-title">Save the Date</div>
  <h1 class="names">Serge <span aria-label="and">♥</span> Nela</h1>

  <section class="machine-wrap" aria-label="Interactive wedding date slot machine">
    <div class="machine-glow"></div>
    <div class="machine">
      <div class="machine-inner">
        <div class="machine-top">Save the Date</div>
        <div class="stars"><b></b><b></b><b></b><b></b><b></b><b></b><b></b></div>
        <div class="slots" aria-live="off">
          <div class="reel" id="r1"><span class="symbol" id="s1">♥</span></div>
          <div class="reel" id="r2"><span class="symbol" id="s2">7</span></div>
          <div class="reel" id="r3"><span class="symbol" id="s3">✦</span></div>
        </div>
        <div class="machine-caption">Three reels · One forever</div>
      </div>
    </div>
    <button type="button" class="lever" id="lever" aria-label="Pull slot machine lever to reveal the date" title="Pull the lever to spin"><span class="lever-hinge"></span><span class="lever-arm"><span class="lever-knob"></span></span></button>
  </section>

  <div class="lever-instruction" id="lever-instruction">✧ Pull the lever to reveal ✧</div>
  <div class="status" id="status" role="status">Take a chance on love...</div>
  <div class="date" id="date">17 · 07 · 2027</div>
  <div class="extra" id="extra">
    <div class="details">Saturday · Caen, France</div>
  </div>
  <footer class="foot">The formal invitation follows</footer>
</main>
<script>
(()=>{
  'use strict';
  const lever=document.getElementById('lever');
  const reels=[1,2,3].map(i=>document.getElementById('r'+i));
  const symbols=[1,2,3].map(i=>document.getElementById('s'+i));
  const status=document.getElementById('status');
  const date=document.getElementById('date');
  const extra=document.getElementById('extra');
  const confettiLayer=document.getElementById('confetti-layer');
  let muted=false,busy=false,ctx;


  function tone(freq=500,length=.08,vol=.045,type='sine'){
    if(muted) return;
    try{
      ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();
      if(ctx.state==='suspended') ctx.resume();
      const osc=ctx.createOscillator(),gain=ctx.createGain();
      osc.type=type;
      osc.frequency.setValueAtTime(freq,ctx.currentTime);
      gain.gain.setValueAtTime(vol,ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+length);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime+length);
    }catch(e){}
  }

  function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms))}

  function confettiBurst(){
    const colors=['c1','c2','c3','c4','c5'];
    const shapes=['r','s','t'];
    const count=120;
    for(let i=0;i<count;i++){
      const piece=document.createElement('div');
      piece.className='confetti '+colors[Math.floor(Math.random()*colors.length)]+' '+shapes[Math.floor(Math.random()*shapes.length)];
      piece.style.left=Math.random()*100+'vw';
      piece.style.setProperty('--dx',(Math.random()*240-120)+'px');
      piece.style.setProperty('--dur',(2.8+Math.random()*2.1)+'s');
      piece.style.setProperty('--rot',(200+Math.random()*720)+'deg');
      piece.style.width=(7+Math.random()*8)+'px';
      piece.style.height=(10+Math.random()*12)+'px';
      piece.style.animationDelay=(Math.random()*0.45)+'s';
      confettiLayer.appendChild(piece);
      setTimeout(()=>piece.remove(),5600);
    }
  }

  async function play(){
    if(busy) return;
    busy=true;
    lever.disabled=true;
    lever.classList.add('pulled');
    setTimeout(()=>lever.classList.remove('pulled'),620);
    date.classList.remove('show');
    extra.classList.remove('show');
    status.textContent='The reels are spinning...';

    const pool=['♥','7','✦','★','♠','♦','♣','17','07','27'];
    const running=[true,true,true];
    reels.forEach(r=>r.classList.add('spinning'));

    const tick=setInterval(()=>{
      for(let i=0;i<3;i++) if(running[i]) symbols[i].textContent=pool[Math.floor(Math.random()*pool.length)];
      tone(230+Math.random()*75,.025,.018,'triangle');
    },85);

    const win=['17','07','27'];
    for(let i=0;i<3;i++){
      await wait(850+i*430);
      running[i]=false;
      reels[i].classList.remove('spinning');
      symbols[i].textContent=win[i];
      tone(500+i*165,.2,.09,'triangle');
    }
    clearInterval(tick);
    await wait(260);
    tone(784,.18,.08);
    setTimeout(()=>tone(988,.2,.09),160);
    setTimeout(()=>tone(1174,.34,.08),320);

    status.textContent='Jackpot! We’re getting married!';
    date.classList.add('show');
    extra.classList.add('show');
    confettiBurst();

    lever.disabled=false;
    busy=false;
  }

  lever.addEventListener('click',play);

})();
</script>
